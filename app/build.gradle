plugins {
    id 'com.android.application'
}

// Ключ подписи хранится вне репозитория. Без keystore.properties сборка подписывается отладочным ключом
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

def nativeOut = layout.buildDirectory.dir('native-libs')

android {
    namespace 'org.zapretcap.app'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.zapretcap.app'
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName '1.5.2-root'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // тем же ключом: отладочная сборка ставится поверх рабочей и сохраняет настройки и разрешение на VPN
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // движки запускаются как программы: им нужны настоящие файлы, а не страницы внутри APK
            useLegacyPackaging true
            // Python и QuickJS для теста видео (youtubedl-android) только под arm64: под каждую архитектуру они весят
            // по 15 МБ, а тест нужен на обычных телефонах. На других архитектурах подбор просто пропускает видео
            // это не настоящие библиотеки, а архивы с расширением .so: strip их не понимает
            keepDebugSymbols += ['**/libpython.zip.so', '**/libpython.so', '**/libqjs.so']
            excludes += ['armeabi-v7a', 'x86', 'x86_64'].collectMany { abi ->
                ['libpython.so', 'libpython.zip.so', 'libqjs.so'].collect { "lib/$abi/$it".toString() }
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [nativeOut.get().asFile]
        }
    }
}

dependencies {
    // HTTP/2 для медиа Telegram: HPACK, ALPN на старых Android и управление потоком уже отлажены
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Тест загрузки видео в подборе: тот же yt-dlp, через который качают музыкальные боты и загрузчики.
    // Только модуль library: ffmpeg и aria2c тесту не нужны
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
}

tasks.register('buildNative', Exec) {
    def script = rootProject.file('native/build-native.sh')
    inputs.file(script)
    inputs.dir(rootProject.file('native/third_party'))
    outputs.dir(nativeOut)
    doFirst {
        commandLine 'bash', script, androidComponents.sdkComponents.ndkDirectory.get().asFile, nativeOut.get().asFile
    }
}

tasks.named('preBuild') {
    dependsOn 'buildNative'
}
